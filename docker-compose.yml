version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "bundle install && rails db:prepare && rails s -b 0.0.0.0"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./client
    command: npm run dev
    ports:
      - "3000:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: